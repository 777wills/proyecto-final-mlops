name: CI/CD - Despliegue automatico de modelos ONNX

# Flujo basado en Pull Requests:
#  - pull_request hacia dev/prod  -> corre SOLO la etapa de test (gate de calidad
#    exigido por la branch protection rule; no despliega nada).
#  - push a dev/prod (al hacer merge del PR) -> corre test + build/promote (despliega).
# Segun la rama se selecciona el GitHub Environment (dev/prod) con sus variables y secrets.
on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

jobs:
  # ---------------------------------------------------------------------------
  # ETAPA 1: LINT
  # Valida estilo y errores estaticos del codigo con ruff.
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ruff
        run: pip install ruff==0.8.4

      - name: Verificar errores y estilo (ruff check)
        run: ruff check app/ tests/ scripts/

      - name: Verificar formato (ruff format)
        run: ruff format --check app/ tests/ scripts/

  # ---------------------------------------------------------------------------
  # ETAPA 2: TEST
  # Descarga el modelo y los datos de prueba del bucket ya que no estan en el repo y
  # corre las pruebas unitarias (respuesta del modelo + umbral de metrica).
  # ---------------------------------------------------------------------------
  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    # En PR el entorno se toma de la rama destino (base_ref); en push, de la rama (ref_name).
    environment: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar en GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Descargar modelo y datos de prueba desde GCS
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          MODEL_GCS_URI: ${{ vars.MODEL_GCS_URI }}
        run: python scripts/download_artifacts.py

      - name: Correr pruebas unitarias
        env:
          METRIC_THRESHOLD: ${{ vars.METRIC_THRESHOLD }}
        run: pytest -v

  # ---------------------------------------------------------------------------
  # ETAPA 2: BUILD / PROMOTE
  # (solo prod) promueve el modelo validado de dev -> prod.
  # Construye el contenedor con el modelo y lo despliega en Cloud Run,
  # actualizando el endpoint del entorno correspondiente.
  # ---------------------------------------------------------------------------
  build-promote:
    name: Build/Promote (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: test
    # Solo despliega cuando hay push (merge del PR). En los PR se ejecuta unicamente 'test'.
    if: github.event_name == 'push'
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar en GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Promover modelo dev -> prod (solo prod)
        if: github.ref_name == 'prod'
        run: |
          gsutil cp \
            "gs://${{ secrets.GCS_BUCKET }}/models/dev/model.onnx" \
            "gs://${{ secrets.GCS_BUCKET }}/models/prod/model.onnx"
          echo "Modelo promovido de dev a prod."

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (para descargar el modelo)
        run: pip install google-cloud-storage==2.19.0

      - name: Descargar modelo del bucket para el build
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          MODEL_GCS_URI: ${{ vars.MODEL_GCS_URI }}
        run: python scripts/download_artifacts.py --model-only

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Construir y publicar la imagen
        env:
          REGION: ${{ secrets.GCP_REGION }}
          PROJECT: ${{ secrets.GCP_PROJECT }}
          SERVICE: ${{ vars.SERVICE_NAME }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/mlops-models/${SERVICE}:${GITHUB_SHA::8}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Desplegar en Cloud Run (actualizar endpoint)
        run: |
          gcloud run deploy "${{ vars.SERVICE_NAME }}" \
            --image "${IMAGE}" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "${{ secrets.RUNTIME_SA }}" \
            --set-env-vars "GCS_BUCKET=${{ secrets.GCS_BUCKET }},LOG_FILE=${{ vars.LOG_FILE }},ENV=${{ vars.APP_ENV }}"

      - name: Smoke test del endpoint (/health)
        run: |
          URL=$(gcloud run services describe "${{ vars.SERVICE_NAME }}" \
            --region "${{ secrets.GCP_REGION }}" --format='value(status.url)')
          echo "URL=${URL}" >> "$GITHUB_ENV"
          echo "Probando ${URL}/health ..."
          for i in 1 2 3 4 5; do
            if curl -fsS "${URL}/health" > /dev/null; then
              echo "Endpoint vivo (intento ${i})."
              exit 0
            fi
            echo "Aun no responde (intento ${i}); reintentando en 10s..."
            sleep 10
          done
          echo "El endpoint no respondio a /health tras varios intentos." >&2
          exit 1

      - name: Mostrar URL del endpoint
        run: |
          echo "### Endpoint ${{ github.ref_name }}: ${URL}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # ETAPA EXTRA: COMENTARIO EN EL PR
  # Publica en el Pull Request el resultado del gate de calidad (lint + test).
  # Solo corre en pull_request; si lint o test fallan, este job no se ejecuta
  # (no se publica el comentario de exito) y la branch protection bloquea el merge.
  # ---------------------------------------------------------------------------
  pr-comment:
    name: comentar en PR
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comentar resultado del gate de calidad
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ✅ **Gate de calidad superado** para la rama `${{ github.base_ref }}`
            - 🔍 lint (ruff): OK
            - 🧪 test (el modelo responde + accuracy ≥ umbral): OK

            El modelo está listo para **merge**. Al hacer merge, el `push` a `${{ github.base_ref }}` desplegará automáticamente el contenedor en el endpoint del entorno.
